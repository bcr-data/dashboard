<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Gerencial — Ligações BCR.CX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#fafafa;color:#18181b;font-size:14px;-webkit-font-smoothing:antialiased}
:root{--bg:#fafafa;--surface:#fff;--border:#e4e4e7;--border-subtle:#f4f4f5;--text:#18181b;--text-2:#71717a;--text-3:#a1a1aa;--brand:#2151E5;--data:#3b82f6;--data-dark:#1e40af;--data-light:#93c5fd;--warn:#f59e0b;--danger:#dc2626;--success:#16a34a}

/* ── HEADER ── */
.header{background:var(--surface);color:var(--text);padding:12px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:0;bottom:0;left:170px;right:0;background-image:url("data:image/svg+xml,%3Csvg width='300' height='520' viewBox='0 0 90 156' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23f7f8fa' stroke-width='0.55'%3E%3Cpath d='M22.5 0L45 13M45 13V39M45 39L22.5 52M22.5 52L0 39M0 39V13M0 13L22.5 0M22.5 52V78M67.5 0L90 13M90 13V39M90 39L67.5 52M67.5 52L45 39M45 39V13M45 13L67.5 0M67.5 52V78M22.5 78L45 91M45 91V117M45 117L22.5 130M22.5 130L0 117M0 117V91M0 91L22.5 78M22.5 130V156M67.5 78L90 91M90 91V117M90 117L67.5 130M67.5 130L45 117M45 117V91M45 91L67.5 78M67.5 130V156'/%3E%3Cpath d='M22.5 26L0 13M22.5 26L45 13M22.5 26V52'/%3E%3Cpath d='M0 65L22.5 52M0 65V91M90 65L67.5 52M90 65V91'/%3E%3Cpath d='M45 65L22.5 78M45 65L67.5 78M45 65V39'/%3E%3Cpath d='M67.5 104L45 91M67.5 104L90 91M67.5 104V130'/%3E%3Cpath d='M0 143L22.5 156M0 143V117M90 143L67.5 156M90 143V117'/%3E%3C/g%3E%3C/svg%3E");background-size:300px 520px;background-position:-70px -30px;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 8%);mask-image:linear-gradient(90deg,transparent 0%,#000 8%);pointer-events:none}
.header>*{position:relative;z-index:1}
.logo-wrap{display:flex;align-items:center;gap:8px}
.logo-wrap img{height:28px;width:auto}
.header-divider{width:1px;height:20px;background:var(--border)}
.header-title{flex:initial;text-align:left}
.header-title h1{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.header-title p{font-size:12px;color:var(--text-2);margin-top:1px}
.header-meta{font-size:12px;text-align:right;color:var(--text-2);margin-left:auto}
.user-chip{display:flex;align-items:center;gap:8px;font-size:12px}
.user-chip span{color:#374151}

/* ── FILTERS ── */
.filters{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:none;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px}
.filter-group label{font-size:11px;font-weight:500;color:var(--text-2)}
.filter-group select,.filter-group input[type=date],.filter-group input[type=number]{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s ease}
.filter-group select:hover,.filter-group input:hover{border-color:var(--text-3)}
.filter-group select:focus,.filter-group input:focus{border-color:var(--text);box-shadow:0 0 0 3px rgba(24,24,27,.06)}
.filter-sla{max-width:100px}
.btn-filter{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;font-weight:500;height:36px;transition:opacity .15s ease;flex-shrink:0}
.btn-filter:hover{opacity:.85}
.btn-reset{background:transparent;color:var(--text-2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;height:36px;transition:background .15s ease,border-color .15s ease;flex-shrink:0}
.btn-reset:hover{background:var(--border-subtle);border-color:var(--text-3)}
/* MULTISELECT */
.ms-wrap{position:relative}
.ms-trigger{border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;color:var(--text);background:var(--surface);cursor:pointer;display:flex;align-items:center;gap:6px;height:36px;overflow:hidden;transition:border-color .15s ease,height .15s ease}
.ms-trigger:hover{border-color:var(--text-3)}
.ms-trigger.open{border-color:var(--text);height:auto;min-height:36px;align-items:flex-start;padding:6px 10px;flex-wrap:wrap}
.ms-chips{display:flex;gap:4px;flex:1;align-items:center;overflow-x:auto;overflow-y:hidden;height:24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.ms-chips::-webkit-scrollbar{height:3px}
.ms-chips::-webkit-scrollbar-track{background:transparent}
.ms-chips::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ms-trigger.open .ms-chips{overflow:visible;height:auto;flex-wrap:wrap}
.ms-chevron{flex-shrink:0;font-size:14px;color:var(--text-3);transition:transform .15s ease;align-self:center;margin-left:auto}
.ms-chevron.open{transform:rotate(180deg)}
.ms-chip{background:#eff6ff;color:#1e40af;border-radius:4px;padding:2px 6px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:2px;white-space:nowrap}
.ms-chip .ms-rm{cursor:pointer;opacity:.6;font-size:13px;line-height:1}
.ms-chip .ms-rm:hover{opacity:1}
.ms-placeholder{color:var(--text-3);font-size:13px}
.ms-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:10px;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.07);overflow:hidden}
.ms-search{padding:8px;border-bottom:1px solid var(--border-subtle)}
.ms-search input{width:100%;border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:12px;outline:none;color:var(--text);background:var(--bg);transition:border-color .15s ease}
.ms-search input:focus{border-color:var(--text)}
.ms-opts{max-height:200px;overflow-y:auto}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:13px;color:var(--text);cursor:pointer;transition:background .1s ease}
.ms-opt:hover{background:var(--border-subtle)}
.ms-opt input[type=checkbox]{accent-color:var(--brand);width:14px;height:14px;cursor:pointer;flex-shrink:0}
.ms-footer{padding:7px 12px;border-top:1px solid var(--border-subtle);display:flex;justify-content:space-between;align-items:center}
.ms-footer-count{font-size:11px;color:var(--text-3)}
.ms-footer-clear{font-size:11px;color:var(--text-2);background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:4px}
.ms-footer-clear:hover{color:var(--text);background:var(--border-subtle)}


/* ── MAIN ── */
.main{padding:20px 24px;display:flex;flex-direction:column;gap:14px;max-width:1600px;margin:0 auto;width:100%}

/* ── KPI CARDS ── */
.kpi-row{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}
@media(max-width:1200px){.kpi-row{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border-radius:12px;padding:16px 18px;border:1px solid var(--border);transition:border-color .15s ease}
.kpi:hover{border-color:var(--text-3)}
.kpi-val{font-size:26px;font-weight:600;color:var(--text);line-height:1;letter-spacing:-0.02em}
.kpi-label{font-size:12px;color:var(--text-2);margin-top:8px}
.kpi-sub{font-size:11px;color:var(--text-3);margin-top:3px}
.kpi-sub.good{color:var(--success)}
.kpi-sub.bad{color:var(--danger)}
.kpi-sub.warn{color:var(--warn)}

/* ── CHART CARDS ── */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-auto-rows:380px}
.charts-row.triple{grid-template-columns:1fr 1fr}
@media(max-width:800px){.charts-row,.charts-row.triple{grid-template-columns:1fr;grid-auto-rows:auto}}
.chart-card{background:var(--surface);border-radius:12px;padding:18px;border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;height:100%}
.chart-card.full{grid-column:1/-1}
.chart-body{flex:1;min-height:0;position:relative;overflow:hidden;height:290px}
.chart-body canvas{display:block;width:100%!important;height:100%!important}
.chart-body-scroll{flex:1;min-height:0;overflow:auto}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:10px;flex-shrink:0}
.card-title{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-0.01em;display:flex;align-items:center;gap:8px}.card-title::before{content:"";display:inline-block;width:3px;height:14px;background:var(--brand);border-radius:2px;flex-shrink:0}
.card-sub{font-size:11px;color:var(--text-3);margin-top:2px}

/* ── HEATMAP ── */
.heatmap-wrap{overflow-x:auto;min-width:max-content}
.heatmap-table{border-collapse:separate;border-spacing:2px;font-size:10px}
.heatmap-table th{padding:2px 4px;color:var(--text-3);font-weight:500;text-align:center;white-space:nowrap;font-size:10px}
.heatmap-table td{width:32px;height:24px;text-align:center;border-radius:4px;font-size:9px;font-weight:600;cursor:default}
.heatmap-table .row-label{color:var(--text-2);font-size:10px;font-weight:500;text-align:right;padding-right:6px;white-space:nowrap;background:transparent}

/* ── HISTOGRAM ── */
.hist-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hist-label{font-size:11px;color:var(--text-2);min-width:56px;text-align:right}
.hist-bar-bg{flex:1;height:16px;background:var(--border-subtle);border-radius:4px;overflow:hidden}
.hist-bar-fill{height:100%;border-radius:4px;background:var(--data);transition:width .4s ease}
.hist-val{font-size:11px;color:var(--text);font-weight:500;min-width:40px}

/* ── LOADING / ERROR ── */
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px;color:var(--text-2);font-size:14px}
.spinner{width:26px;height:26px;border:2.5px solid var(--border-subtle);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:16px 20px;color:#b91c1c;font-size:13px;margin:20px 24px}
.empty-state{text-align:center;padding:48px;color:var(--text-3);font-size:14px}


/* ── MATRIX TABLE ── */
.matrix-card{background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-top:0}
.matrix-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.matrix-title{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.matrix-wrap{overflow:auto;max-height:420px}
.matrix-table{width:100%;border-collapse:collapse;font-size:11px}
.matrix-table thead th{position:sticky;top:0;background:#fff;color:var(--text-2);font-weight:500;padding:8px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;font-size:10px;z-index:2}
.matrix-table thead th:first-child{text-align:left;position:sticky;left:0;z-index:3;background:var(--bg)}
.matrix-table tbody td{padding:7px 12px;border-bottom:1px solid var(--border-subtle);text-align:right;white-space:nowrap;color:var(--text);background:#fff}
.matrix-table tbody td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);z-index:1;font-weight:500;cursor:pointer;color:var(--text)}
.matrix-table tbody tr:hover td{background:#f0f4ff}
.matrix-table tbody tr:hover td:first-child{background:#e8eef8}
.matrix-row-fila td:first-child{color:var(--text);font-weight:400}
.matrix-row-colab td:first-child{padding-left:24px;color:var(--text);font-weight:400;font-size:10px}
.matrix-row-fila{background:var(--bg)}
.ns-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.ns-good{background:var(--success)}.ns-warn{background:var(--warn)}.ns-bad{background:var(--danger)}
/* ── CHART DIM TOGGLES ── */
.tf-btn{border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;background:transparent;color:var(--text-2);font-weight:500;transition:all .15s}
.tf-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
/* ── TIME FILTER TOGGLES ── */
.time-filter-group{display:flex;gap:4px;align-items:center;flex-shrink:0}
.time-filter-group label{font-size:10px;color:var(--text-3);font-weight:500;margin-right:2px}
.time-toggle{border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;background:transparent;color:var(--text-2);font-weight:500;transition:all .15s}
.time-toggle.active,.time-toggle[data-active="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dim-group{display:flex;gap:3px;background:var(--border-subtle);border-radius:8px;padding:3px}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-card{background:var(--surface);border-radius:16px;padding:40px 36px;width:100%;max-width:380px;border:1px solid var(--border)}
.login-logo{display:flex;justify-content:center;margin-bottom:28px}
.login-logo img{height:44px;width:auto}
.login-title{font-size:19px;font-weight:600;color:var(--text);text-align:center;margin-bottom:28px;letter-spacing:-0.01em}
.login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.login-field label{font-size:12px;font-weight:500;color:var(--text-2)}
.login-field input{border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--text);outline:none;transition:border-color .15s ease,box-shadow .15s ease}
.login-field input:focus{border-color:var(--text);box-shadow:0 0 0 3px rgba(24,24,27,.06)}
.btn-login{width:100%;background:var(--brand);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:500;cursor:pointer;margin-top:6px;transition:opacity .15s ease}
.btn-login:hover{opacity:.9}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.login-error{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;color:#b91c1c;font-size:13px;margin-top:12px;display:none}
.login-spinner{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><img src="./logo.png" alt="BCR.CX"></div>
    <div class="login-title">Dashboard Gerencial</div>
    <div class="login-field">
      <label>E-mail</label>
      <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="login-field">
      <label>Senha</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login">
      <span id="login-label">Entrar</span>
      <div class="login-spinner" id="login-spinner"></div>
    </button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">
  <div class="header">
    <div class="logo-wrap"><img src="./logo.png" alt="BCR.CX"></div>
    <div class="header-divider"></div>
    <div class="header-title">
      <h1>Dashboard Gerencial — Ligações</h1>
      <p>Análise operacional de call center</p>
    </div>
    <div class="header-meta">
      <div class="user-chip"><span id="user-email-display"></span></div>
    </div>
  </div>

  <div class="filters" id="filters-bar">
    <div class="filter-group">
      <label>Data início</label>
      <input type="date" id="f-date-start">
    </div>
    <div class="filter-group">
      <label>Data fim</label>
      <input type="date" id="f-date-end">
    </div>
    <div class="filter-group ms-wrap" id="ms-wrap-equipe">
      <label>Equipe</label>
      <div class="ms-trigger" id="ms-trigger-equipe" onclick="msToggle('equipe')">
        <div class="ms-chips" id="ms-chips-equipe"><span class="ms-placeholder">Todas as equipes</span></div>
        <i class="ms-chevron" id="ms-chev-equipe">▾</i>
      </div>
      <div class="ms-dropdown" id="ms-dd-equipe" style="display:none">
        <div class="ms-search"><input type="text" placeholder="Buscar..." oninput="msFilter(this,'ms-list-equipe')" id="ms-srch-equipe"></div>
        <div class="ms-opts" id="ms-list-equipe"></div>
        <div class="ms-footer"><span class="ms-footer-count" id="ms-count-equipe">0 selecionados</span><button class="ms-footer-clear" onclick="msClear('equipe')">Limpar</button></div>
      </div>
    </div>
    <div class="filter-group ms-wrap" id="ms-wrap-fila">
      <label>Fila</label>
      <div class="ms-trigger" id="ms-trigger-fila" onclick="msToggle('fila')">
        <div class="ms-chips" id="ms-chips-fila"><span class="ms-placeholder">Todas as filas</span></div>
        <i class="ms-chevron" id="ms-chev-fila">▾</i>
      </div>
      <div class="ms-dropdown" id="ms-dd-fila" style="display:none">
        <div class="ms-search"><input type="text" placeholder="Buscar..." oninput="msFilter(this,'ms-list-fila')" id="ms-srch-fila"></div>
        <div class="ms-opts" id="ms-list-fila"></div>
        <div class="ms-footer"><span class="ms-footer-count" id="ms-count-fila">0 selecionados</span><button class="ms-footer-clear" onclick="msClear('fila')">Limpar</button></div>
      </div>
    </div>
    <div class="filter-group ms-wrap" id="ms-wrap-colab">
      <label>Colaborador</label>
      <div class="ms-trigger" id="ms-trigger-colab" onclick="msToggle('colab')">
        <div class="ms-chips" id="ms-chips-colab"><span class="ms-placeholder">Todos os colaboradores</span></div>
        <i class="ms-chevron" id="ms-chev-colab">▾</i>
      </div>
      <div class="ms-dropdown" id="ms-dd-colab" style="display:none">
        <div class="ms-search"><input type="text" placeholder="Buscar..." oninput="msFilter(this,'ms-list-colab')" id="ms-srch-colab"></div>
        <div class="ms-opts" id="ms-list-colab"></div>
        <div class="ms-footer"><span class="ms-footer-count" id="ms-count-colab">0 selecionados</span><button class="ms-footer-clear" onclick="msClear('colab')">Limpar</button></div>
      </div>
    </div>
    <input type="hidden" id="f-sla" value="20">
    <button class="btn-filter" id="btn-filtrar">Filtrar</button>
    <button class="btn-reset" id="btn-limpar">Limpar</button>
  </div>

  <div class="main" id="app">
    <div class="loading"><div class="spinner"></div>Carregando dados...</div>
  </div>
</div>

<script>

// ── MULTISELECT ──
const msSel = {equipe: new Set(), fila: new Set(), colab: new Set()};
const msPlaceholder = {equipe:'Todas as equipes', fila:'Todas as filas', colab:'Todos os colaboradores'};
const MS_KEYS = ['equipe','fila','colab'];

function msFill(k, opts) {
  const list = document.getElementById('ms-list-'+k);
  if(!list) return;
  list.innerHTML = opts.map(v => {
    const checked = msSel[k].has(v) ? 'checked' : '';
    const esc = v.replace(/"/g,'&quot;').replace(/'/g,"\'");
    return `<label class="ms-opt"><input type="checkbox" ${checked} onchange="msToggleOpt('${k}','${esc}',this)"><span>${v}</span></label>`;
  }).join('');
  msRenderChips(k);
}

function msToggle(k) {
  const dd = document.getElementById('ms-dd-'+k);
  const chev = document.getElementById('ms-chev-'+k);
  const trigger = document.getElementById('ms-trigger-'+k);
  const isOpen = dd.style.display !== 'none';
  MS_KEYS.forEach(x => {
    const d = document.getElementById('ms-dd-'+x);
    const c = document.getElementById('ms-chev-'+x);
    const t = document.getElementById('ms-trigger-'+x);
    if(d) d.style.display='none';
    if(c) c.classList.remove('open');
    if(t) t.classList.remove('open');
  });
  if(!isOpen) {
    dd.style.display='block';
    chev.classList.add('open');
    trigger.classList.add('open');
    const srch = document.getElementById('ms-srch-'+k);
    if(srch){ srch.value=''; msFilter(srch,'ms-list-'+k); srch.focus(); }
  }
}

function msToggleOpt(k, v, cb) {
  if(cb.checked) msSel[k].add(v); else msSel[k].delete(v);
  msRenderChips(k);
  if(k === 'equipe' && window.reloadDependentFilters) window.reloadDependentFilters();
}

function fmtMmSs(seg) {
  if (!seg && seg !== 0) return '--';

function fmtPct(v, total) {

function fmtN(n) { return Number(n || 0).toLocaleString('pt-BR'); }
function parseDate(d) {

// ── WORKER QUERY ──
async function queryBQ(sql) {
  const res = await fetch(WORKER, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
    body: JSON.stringify({ query: sql })
  });
  if (!res.ok) throw new Error(`Worker error ${res.status}`);
  const json = await res.json();
  if (!json.rows) return [];
  return json.rows.map(row => {
    const obj = {};
    json.schema.fields.forEach((f, i) => {
      const v = row.f[i].v;
      obj[f.name] = (f.type === 'INTEGER' || f.type === 'FLOAT') ? (v === null ? null : Number(v)) : v;
    });
    return obj;
  });
}

      : 'WHERE';

        queryBQ(`SELECT DISTINCT queue_name as v FROM \`bcrcx-wfm.BCRCX.__pbx_calls\` ${whereEq} queue_name IS NOT NULL ORDER BY queue_name`),
        queryBQ(`SELECT DISTINCT name as v FROM \`bcrcx-wfm.BCRCX.__pbx_calls\` ${whereEq} name IS NOT NULL ORDER BY name`)
      ]);
      const filaVals = new Set(filas.map(r=>r.v));
      const nameVals = new Set(names.map(r=>r.v));
      [...msSel.fila].forEach(v => { if(!filaVals.has(v)) msSel.fila.delete(v); });
      [...msSel.colab].forEach(v => { if(!nameVals.has(v)) msSel.colab.delete(v); });
      msFill('fila', filas.map(r=>r.v));

    } catch(e) { console.warn('Cascade filter error', e); }
  };
  document.getElementById('f-date-start').value = daysAgo(30);

  try {
    const [origens, filas, names] = await Promise.all([
      queryBQ(`SELECT DISTINCT origem as v FROM \`bcrcx-wfm.BCRCX.__pbx_calls\` WHERE origem IS NOT NULL ORDER BY origem`),

async function loadData() {
  document.getElementById('app').innerHTML = '<div class="loading"><div class="spinner"></div>Buscando dados...</div>';
  const ds = document.getElementById('f-date-start').value;
  const de = document.getElementById('f-date-end').value;
  const sla = 20;

  let where = `WHERE PARSE_DATE('%d-%m-%y', Data) BETWEEN PARSE_DATE('%d-%m-%y', '${isoToBq(ds)}') AND PARSE_DATE('%d-%m-%y', '${isoToBq(de)}')`;
  where += sqlIn('origem', [...msSel.equipe]);
  where += sqlIn('queue_name', [...msSel.fila]);
  where += sqlIn('name', [...msSel.colab]);

  try {
    const data = await queryBQ(`
      SELECT
        Data, Hora,
        SUM(Total_Ligacoes) as Total_Ligacoes,
        SUM(Atendidas) as Atendidas,
        SUM(Abandonadas) as Abandonadas,
        SUM(CASE WHEN TME_seg <= ${sla} THEN Atendidas ELSE 0 END) as Atend_no_SLA,
        SUM(TMA_seg) / NULLIF(SUM(Atendidas), 0) as TMA_medio,
        SUM(TME_seg) / NULLIF(SUM(Total_Ligacoes), 0) as TME_medio
      FROM \`bcrcx-wfm.BCRCX.__pbx_calls\`
      ${where}
      GROUP BY Data, Hora
      ORDER BY Data, Hora
    `);
    buildDashboard(data, sla);
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="error-box">⚠️ Erro ao buscar dados: ${e.message}</div>`;
  }
}

  async function loadCsat() {
    let whereCsat = `WHERE Data BETWEEN DATE('${ds}') AND DATE('${de}')`;
        whereCsat += sqlIn('origem', equipe);
    if (fila.length)   whereCsat += ` AND queue_name IN (${fila.map(v=>`'${v.replace(/'/g,"''")}'`).join(',')})`;
    if (colab.length)  whereCsat += ` AND name IN (${colab.map(v=>`'${v.replace(/'/g,"''")}'`).join(',')})`;

    try {
      const rows = await queryBQ(`
        SELECT
          FORMAT_DATE('%d-%m-%y', Data) AS Data,
          EXTRACT(HOUR FROM DATETIME(Data, TIME(Hora,0,0))) AS Hora,
          origem,
          queue_name,
          name,
          SUM(Total_Encaminhadas_Pesquisa) AS encaminhadas,
          SUM(Total_Pesquisas) AS respondidas,
          SUM(Total_Satisfeito) AS satisfeito
        FROM \`bcrcx-wfm.BCRCX.csat\`
        ${whereCsat}
        GROUP BY Data, Hora, origem, queue_name, name
        ORDER BY Data
      `);

      csatRawRows = rows;
      csatByDate = {};
      rows.forEach(r => {
        if (!csatByDate[r.Data]) csatByDate[r.Data] = {enc:0, resp:0, sat:0};
        csatByDate[r.Data].enc  += r.encaminhadas||0;
        csatByDate[r.Data].resp += r.respondidas||0;
        csatByDate[r.Data].sat  += r.satisfeito||0;
      });

      // KPI global
      const totEnc  = rows.reduce((a,r)=>a+(r.encaminhadas||0),0);
      const totResp = rows.reduce((a,r)=>a+(r.respondidas||0),0);
      const totSat  = rows.reduce((a,r)=>a+(r.satisfeito||0),0);
      const csatPct = totResp > 0 ? (totSat/totResp*100) : 0;
      const aderPct = totEnc  > 0 ? (totResp/totEnc*100) : 0;
      const kpiVal = document.getElementById('kpi-csat-val');
      const kpiSub = document.getElementById('kpi-csat-sub');
      if (kpiVal) kpiVal.textContent = csatPct.toFixed(1).replace('.',',')+'%';
      if (kpiSub) kpiSub.textContent = fmtN(totResp)+' pesq. respondidas';
      const aderVal = document.getElementById('kpi-aderencia-val');
      const aderSub = document.getElementById('kpi-aderencia-sub');
      if (aderVal) aderVal.textContent = aderPct.toFixed(1).replace('.',',')+'%';
      if (aderSub) aderSub.textContent = fmtN(totEnc)+' pesq. encaminhadas';

      renderCsatChart(dates);
      buildHeatmap('heatmap-csat','csat');
    } catch(e) {
      const kpiSub = document.getElementById('kpi-csat-sub');
      if (kpiSub) kpiSub.textContent = 'Erro ao carregar';
    }
  }

  function aggregateCsatByDim(dim) {
    const agg = {};
    const empty = () => ({enc:0, resp:0, sat:0});
    csatRawRows.forEach(r => {
      let key;
      if (dim === 'data') {
        key = r.Data;
      } else if (dim === 'mes') {
        key = getMonthLabel(r.Data);
      } else if (dim === 'dow') {
        key = DOW_ORDER[getDOW(r.Data)];
      } else if (dim === 'hora') {
        const h = r.Hora != null ? String(r.Hora).padStart(2,'0') : '00';
        key = h+'h';
      } else {
        key = r.Data;
      }
      if (!agg[key]) agg[key] = empty();
      agg[key].enc  += r.encaminhadas||0;
      agg[key].resp += r.respondidas||0;
      agg[key].sat  += r.satisfeito||0;
    });

    let labels;
    if (dim === 'data')  labels = dates;
    else if (dim === 'mes')  labels = [...new Set(csatRawRows.map(r=>getMonthLabel(r.Data)))];
    else if (dim === 'dow')  labels = DOW_ORDER.filter(d=>agg[d]);
    else if (dim === 'hora') labels = allHours.filter(h=>agg[h+'h']).map(h=>h+'h');
    else labels = dates;

    return {labels, agg};
  }

  const DOW_MAP = {'Segunda':1,'Terça':2,'Quarta':3,'Quinta':4,'Sexta':5,'Sábado':6,'Domingo':0};
  const MONTH_NAMES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  function bqToDate(bqStr) {
    if (!bqStr) return null;
    const [dd,mm,yy] = bqStr.split('-');
    return new Date(2000+parseInt(yy), parseInt(mm)-1, parseInt(dd));
  }

  function getMonthLabel(bqStr) {
    const d = bqToDate(bqStr);
    return d ? MONTH_NAMES[d.getMonth()] + '/' + String(d.getFullYear()).slice(2) : '';
  }

  function getDOW(bqStr) {
    const d = bqToDate(bqStr);
    return d ? d.getDay() : -1;
  }

  // ── DIMENSION AGGREGATION ──
  const chartDims = {vol:'data', sla:'data', tma:'data', csat:'data'};
  const DOW_ORDER = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  function aggregateByDim(dim) {
    const agg = {};
    const empty = () => ({lig:0,atend:0,aband:0,sla:0,tmaSum:0,tmaW:0,tmeSum:0,tmeW:0});
    if (dim === 'data') {
      dates.forEach(d => { agg[d] = Object.assign(empty(), byDate[d]); });
      return {labels: dates, agg};
    } else if (dim === 'mes') {
      dates.forEach(d => {
        const k = getMonthLabel(d);
        if (!agg[k]) agg[k] = empty();
        const b = byDate[d];
        agg[k].lig+=b.lig||0; agg[k].atend+=b.atend||0; agg[k].aband+=b.aband||0;
        agg[k].sla+=b.sla||0; agg[k].tmaSum+=b.tmaSum||0; agg[k].tmaW+=b.tmaW||0;
        agg[k].tmeSum+=b.tmeSum||0; agg[k].tmeW+=b.tmeW||0;
      });
      return {labels: Object.keys(agg), agg};
    } else if (dim === 'dow') {
      DOW_ORDER.forEach(d => agg[d] = empty());
      dates.forEach(d => {
        const k = DOW_ORDER[getDOW(d)];
        const b = byDate[d];
        agg[k].lig+=b.lig||0; agg[k].atend+=b.atend||0; agg[k].aband+=b.aband||0;
        agg[k].sla+=b.sla||0; agg[k].tmaSum+=b.tmaSum||0; agg[k].tmaW+=b.tmaW||0;
        agg[k].tmeSum+=b.tmeSum||0; agg[k].tmeW+=b.tmeW||0;
      });
      const labelsWithData = DOW_ORDER.filter(d => agg[d].lig > 0);
      return {labels: labelsWithData, agg};
    } else if (dim === 'hora') {
      // byHour has lig/sla/tot but not tma/tme breakdown
      // Use rawData (data array) to aggregate by hour
      allHours.forEach(h => { agg[h+'h'] = empty(); });
      rawData.forEach(r => {
        const h = r.Hora ? String(r.Hora).padStart(2,'0').slice(0,2) : '00';
        const k = h+'h';
        if (!agg[k]) agg[k] = empty();
        agg[k].lig   += r.Total_Ligacoes||0;
        agg[k].atend += r.Atendidas||0;
        agg[k].aband += r.Abandonadas||0;
        agg[k].sla   += r.Atend_no_SLA||0;
        agg[k].tmaSum += (r.TMA_medio||0)*(r.Atendidas||0);
        agg[k].tmaW  += r.Atendidas||0;
        agg[k].tmeSum += (r.TME_medio||0)*((r.Atendidas||0)+(r.Abandonadas||0));
        agg[k].tmeW  += (r.Atendidas||0)+(r.Abandonadas||0);
      });
      return {labels: allHours.filter(h=>agg[h+'h'].lig>0).map(h=>h+'h'), agg};
    }
    return {labels: dates, agg};
  }

  function setTfBtnActive(chart, dim) {
    ['data','mes','dow','hora','equipe','fila','colaborador'].forEach(d => {
      const btn = document.getElementById('tf-'+chart+'-'+d);
      if (!btn) return;
      const active = d === dim;
      btn.style.background = active ? 'var(--surface)' : 'transparent';
      btn.style.color = active ? 'var(--text)' : 'var(--text-2)';
      btn.style.boxShadow = active ? '0 1px 2px rgba(0,0,0,.06)' : 'none';
      if (active) btn.classList.add('active'); else btn.classList.remove('active');
    });
  }

  window.setChartDim = function(chart, dim) {
    chartDims[chart] = dim;
    setTfBtnActive(chart, dim);
    const {labels, agg} = aggregateByDim(dim);
    function updateChartData(chartObj, labels, datasets) {
      chartObj.data.labels = labels;
      datasets.forEach((ds, i) => {
        if (chartObj.data.datasets[i]) chartObj.data.datasets[i].data = ds;
      });
      chartObj.update('none');
    }

    if (chart === 'vol' && charts.vol) {
      if (['equipe','fila','colaborador'].includes(dim)) {
        setHeatmapDim('vol', dim);
        return;
      }
      updateChartData(charts.vol, labels, [
        labels.map(l=>agg[l]?.atend||0),
        labels.map(l=>agg[l]?.aband||0),
        labels.map(l=>agg[l]?.lig>0?+(agg[l].sla/agg[l].lig*100).toFixed(1):0),
      ]);
    } else if (chart === 'sla' && charts.sla) {
      updateChartData(charts.sla, labels, [
        labels.map(l=>agg[l]?.lig>0?+(agg[l].sla/agg[l].lig*100).toFixed(1):0),
        labels.map(()=>80)
      ]);
    } else if (chart === 'tma' && charts.tmatme) {
      if (['equipe','fila'].includes(dim)) {
        const field = dim === 'equipe' ? 'origem' : 'queue_name';
        const dsv2 = document.getElementById('f-date-start').value;
        const dev2 = document.getElementById('f-date-end').value;
        let wh = `WHERE PARSE_DATE('%d-%m-%y', Data) BETWEEN PARSE_DATE('%d-%m-%y', '${isoToBq(dsv2)}') AND PARSE_DATE('%d-%m-%y', '${isoToBq(dev2)}')`;
        wh += sqlIn('origem',     [...msSel.equipe]);
        wh += sqlIn('queue_name', [...msSel.fila]);
        wh += sqlIn('name',       [...msSel.colab]);
        queryBQ(`
          SELECT ${field} as label,
            SUM(TMA_seg) / NULLIF(SUM(Atendidas), 0) as tma,
            SUM(TME_seg) / NULLIF(SUM(Total_Ligacoes), 0) as tme
          FROM \`bcrcx-wfm.BCRCX.__pbx_calls\`
          ${wh}
          GROUP BY ${field}
          ORDER BY SUM(Total_Ligacoes) DESC
          LIMIT 30
        `).then(rows2 => {
          const lbls  = rows2.map(r => dim==='fila' ? (r.label||'').replace(/^[^-]+-/,'')||r.label||'—' : (r.label||'—'));
          const tmaVs = rows2.map(r => +(r.tma||0).toFixed(1));
          const tmeVs = rows2.map(r => +(r.tme||0).toFixed(1));
          updateChartData(charts.tmatme, lbls, [tmaVs, tmeVs]);
        }).catch(e => console.warn('TMA grouped error', e));
      } else {
        updateChartData(charts.tmatme, labels, [
          labels.map(l=>agg[l]?.tmaW>0?+(agg[l].tmaSum/agg[l].tmaW).toFixed(1):0),
          labels.map(l=>agg[l]?.tmeW>0?+(agg[l].tmeSum/agg[l].tmeW).toFixed(1):0)
        ]);
      }
    } else if (chart === 'csat') {
      if (['equipe','fila','colaborador'].includes(dim)) {
        if (window.renderCsatGrouped) window.renderCsatGrouped(dim);
      } else {
        if (window.renderCsatChart) window.renderCsatChart();
      }
    }
    // rebuild heatmaps only if on a time dim (not grouped)
    if (!['equipe','fila','colaborador'].includes(hmDim.vol))  buildHeatmap('heatmap-vol','vol');
    if (!['equipe','fila','colaborador'].includes(hmDim.csat)) buildHeatmap('heatmap-csat','csat');
  };

  const hmDim = {vol:'data', csat:'data'};
  const DOW_LABELS_FULL = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

  window.setHeatmapDim = function(chart, dim) {
    hmDim[chart] = dim;
    ['data','mes','dow','equipe','fila','colaborador'].forEach(d => {
      const btn = document.getElementById('hm-'+chart+'-dim-'+d);
      if (!btn) return;
      const active = d === dim;
      btn.style.background = active ? 'var(--surface)' : 'transparent';
      btn.style.color = active ? 'var(--text)' : 'var(--text-2)';
      btn.style.boxShadow = active ? '0 1px 2px rgba(0,0,0,.06)' : 'none';
      if (active) btn.classList.add('active'); else btn.classList.remove('active');
    });
    buildHeatmap('heatmap-'+chart, chart);
  };

  // csatHour lookup built from csatRawRows
  function buildCsatHourMap() {
    const map = {};
    csatRawRows.forEach(r => {
      const h = r.Hora != null ? String(r.Hora).padStart(2,'0') : '00';
      const k = r.Data+'_'+h;
      if (!map[k]) map[k] = {resp:0, sat:0};
      map[k].resp += r.respondidas||0;
      map[k].sat  += r.satisfeito||0;
    });
    return map;
  }

  function buildHeatmap(id, type) {
    const dim = hmDim[type] || 'data';
    const csatMap = type==='csat' ? buildCsatHourMap() : null;
    const hourHeaders = allHours.map(h=>'<th>'+h+'h</th>').join('');

    function renderHtml(rowsData) {
      let html = '<table class="heatmap-table"><thead><tr><th></th>'+hourHeaders+'</tr></thead><tbody>';
      rowsData.forEach(({label, getVal}) => {
        html += '<tr><td class="row-label">'+label+'</td>';
        allHours.forEach(h => {
          const rec = getVal(h);
          if (type==='csat') {
            const pct = rec.resp>0?(rec.sat/rec.resp*100):null;
            const bg = pct!=null ? heatColor(pct, 100, 'sla') : '#f4f4f5';
            html += '<td style="background:'+bg+';color:#fff">'+(pct!=null?Math.round(pct)+'%':'')+'</td>';
          } else {
            const v = rec.lig||0;
            const bg = heatColor(v, maxVol, 'vol');
            const tc = maxVol>0&&v/maxVol>0.5?'#fff':'#71717a';
            html += '<td style="background:'+bg+';color:'+tc+'">'+(v||'')+'</td>';
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      const el = document.getElementById(id);
      if (el) el.innerHTML = html;
    }

    if (dim === 'data') {
      const rowDates = type==='csat'
        ? [...new Set(csatRawRows.map(r=>r.Data))].sort((a,b)=>a.localeCompare(b))
        : showDates;
      renderHtml(rowDates.map(d => ({
        label: d,
        getVal: h => type==='csat' ? (csatMap[d+'_'+h]||{}) : (byHour[d+'_'+h]||{})
      })));
    } else if (dim === 'mes') {
      const srcDates = type==='csat' ? [...new Set(csatRawRows.map(r=>r.Data))] : allDates;
      const months = [...new Set(srcDates.map(d=>getMonthLabel(d)))];
      renderHtml(months.map(m => {
        const mDates = srcDates.filter(d=>getMonthLabel(d)===m);
        return { label: m, getVal: h => {
          if (type==='csat') { const a={resp:0,sat:0}; mDates.forEach(d=>{const r=csatMap[d+'_'+h]||{};a.resp+=r.resp||0;a.sat+=r.sat||0;}); return a; }
          const a={lig:0,sla:0,tot:0}; mDates.forEach(d=>{const r=byHour[d+'_'+h]||{};a.lig+=r.lig||0;a.sla+=r.sla||0;a.tot+=r.tot||0;}); return a;
        }};
      }));
    } else if (dim === 'dow') {
      const srcDates = type==='csat' ? [...new Set(csatRawRows.map(r=>r.Data))] : allDates;
      const rows3 = DOW_LABELS_FULL.map((label, dow) => {
        const dowDates = srcDates.filter(d=>getDOW(d)===dow);
        if (!dowDates.length) return null;
        return { label, getVal: h => {
          if (type==='csat') { const a={resp:0,sat:0}; dowDates.forEach(d=>{const r=csatMap[d+'_'+h]||{};a.resp+=r.resp||0;a.sat+=r.sat||0;}); return a; }
          const a={lig:0,sla:0,tot:0}; dowDates.forEach(d=>{const r=byHour[d+'_'+h]||{};a.lig+=r.lig||0;a.sla+=r.sla||0;a.tot+=r.tot||0;}); return a;
        }};
      }).filter(Boolean);
      renderHtml(rows3);
    } else if (['equipe','fila','colaborador'].includes(dim)) {
      const fieldMap = {equipe:'origem', fila:'queue_name', colaborador:'name'};
      const field = fieldMap[dim];
      const el = document.getElementById(id);

      if (type === 'csat') {
        // Build heatmap rows from csatRawRows grouped by field × hour
        const byFieldHour = {};
        csatRawRows.forEach(r => {
          const key = r[field] || '—';
          const h   = r.Hora != null ? String(Math.floor(r.Hora)).padStart(2,'0') : '00';
          const k   = key+'___'+h;
          if (!byFieldHour[k]) byFieldHour[k] = {resp:0, sat:0};
          byFieldHour[k].resp += r.respondidas||0;
          byFieldHour[k].sat  += r.satisfeito||0;
        });
        const keys = [...new Set(csatRawRows.map(r=>r[field]||'—'))];
        const totals = {};
        keys.forEach(k => { totals[k] = csatRawRows.filter(r=>(r[field]||'—')===k).reduce((a,r)=>a+(r.respondidas||0),0); });
        const sorted = keys.sort((a,b)=>totals[b]-totals[a]).slice(0,30);
        renderHtml(sorted.map(key => ({
          label: key,
          getVal: h => byFieldHour[key+'___'+h.padStart(2,'0')] || {}
        })));
      } else {
        // vol — needs BQ query for field × hour breakdown
        const dsv2 = document.getElementById('f-date-start').value;
        const dev2 = document.getElementById('f-date-end').value;
        let wh = `WHERE PARSE_DATE('%d-%m-%y', Data) BETWEEN PARSE_DATE('%d-%m-%y', '${isoToBq(dsv2)}') AND PARSE_DATE('%d-%m-%y', '${isoToBq(dev2)}')`;
        wh += sqlIn('origem',     [...msSel.equipe]);
        wh += sqlIn('queue_name', [...msSel.fila]);
        wh += sqlIn('name',       [...msSel.colab]);
        if (el) el.innerHTML = '<div class="loading" style="padding:24px"><div class="spinner"></div>Carregando...</div>';
        queryBQ(`SELECT ${field} as grp, Hora, SUM(Total_Ligacoes) as lig FROM \`bcrcx-wfm.BCRCX.__pbx_calls\` ${wh} GROUP BY ${field}, Hora ORDER BY SUM(Total_Ligacoes) DESC`)
          .then(rows2 => {
            const byGrpHour = {};
            const grpTotals = {};
            rows2.forEach(r => {
              const g = r.grp||'—';
              const h = r.Hora!=null ? String(Math.floor(r.Hora)).padStart(2,'0') : '00';
              if (!byGrpHour[g+'___'+h]) byGrpHour[g+'___'+h] = {lig:0};
              byGrpHour[g+'___'+h].lig += r.lig||0;
              grpTotals[g] = (grpTotals[g]||0)+(r.lig||0);
            });
            const maxV = Math.max(1, ...Object.values(byGrpHour).map(v=>v.lig||0));
            const grps = Object.keys(grpTotals).sort((a,b)=>grpTotals[b]-grpTotals[a]).slice(0,30);
            let html = '<table class="heatmap-table"><thead><tr><th></th>'+hourHeaders+'</tr></thead><tbody>';
            grps.forEach(g => {
              html += '<tr><td class="row-label">'+g+'</td>';
              allHours.forEach(h => {
                const v = (byGrpHour[g+'___'+h]||{}).lig||0;
                const bg = heatColor(v, maxV, 'vol');
                const tc = maxV>0&&v/maxV>0.5?'#fff':'#71717a';
                html += '<td style="background:'+bg+';color:'+tc+'">'+(v||'')+'</td>';
              });
              html += '</tr>';
            });
            html += '</tbody></table>';
            if (el) el.innerHTML = html;
          }).catch(e => { if (el) el.innerHTML = `<div class="error-box">⚠️ ${e.message}</div>`; });
      }
    }
  }
  // CSAT grouped by equipe/fila/colaborador for CSAT por Período chart
  window.renderCsatGrouped = function(dim) {
    const fieldMap = {equipe:'origem', fila:'queue_name', colaborador:'name'};
    const field = fieldMap[dim];
    const grouped = {};
    csatRawRows.forEach(r => {
      // BQ may return field names as-is; try both cases
      const key = r[field] || r[field.toLowerCase()] || r[field.toUpperCase()] || '—';
      if (!grouped[key]) grouped[key] = {enc:0, resp:0, sat:0};
      grouped[key].enc  += r.encaminhadas||0;
      grouped[key].resp += r.respondidas||0;
      grouped[key].sat  += r.satisfeito||0;
    });
    const entries = Object.entries(grouped).sort((a,b)=>b[1].resp-a[1].resp).slice(0,20);

      type:'bar',

        {label:'Respondidas', data:resp,backgroundColor:'rgba(59,130,246,.55)',borderRadius:3,borderSkipped:false,yAxisID:'y'},
        {label:'%CSAT',type:'line',data:pct,borderColor:'#3b82f6',pointBackgroundColor:'#3b82f6',backgroundColor:'transparent',tension:.3,pointRadius:3,borderWidth:1.5,yAxisID:'y2'},
      ]},
      options:{

          datalabels:{

            formatter:(v,ctx)=>ctx.dataset.yAxisID==='y2'?(v>0?v.toFixed(1).replace('.',',')+'%':''):( v>0?fmtN(v):''),
            anchor:(ctx)=>ctx.dataset.yAxisID==='y2'?'center':'end',
            align:(ctx)=>ctx.dataset.yAxisID==='y2'?'top':'end',
            font:{size:8}, color:'#71717a', clip:false
          },

          tooltip:{callbacks:{label:ctx=>ctx.dataset.label===('%CSAT')?ctx.dataset.label+': '+ctx.raw+'%':ctx.dataset.label+': '+fmtN(ctx.raw)}}
        },

          y2:{grid:{display:false},border:{display:false},ticks:{font:{size:10},color:'#71717a',callback:v=>v+'%'},min:0,max:100,position:'right'}
        }
      }
    });

  // ── CSAT MATRIX ──
  let csatMatrixMode = 'equipe';

  window.loadCsatMatrix = async function(mode) {
    csatMatrixMode = mode;
    const allModes = ['data','mes','dow','hora','equipe','fila','colab'];
    allModes.forEach(k => {
      const btn = document.getElementById('btn-csat-mx-'+k);
      if (!btn) return;
      const active = k === mode;
      btn.style.background = active ? 'var(--surface)' : 'transparent';
      btn.style.color = active ? 'var(--text)' : 'var(--text-2)';
      btn.style.boxShadow = active ? '0 1px 2px rgba(0,0,0,.06)' : 'none';
      if (active) btn.classList.add('active'); else btn.classList.remove('active');
    });

    let groupExpr, labelCol, orderBy;
    if (mode === 'data')       { groupExpr = `FORMAT_DATE('%d-%m-%y', Data)`; labelCol = 'Data';        orderBy = 'label'; }
    else if (mode === 'mes')   { groupExpr = `FORMAT_DATE('%m/%y', Data)`;    labelCol = 'Mês';         orderBy = 'label'; }
    else if (mode === 'dow')   { groupExpr = `FORMAT_DATE('%A', Data)`;       labelCol = 'Dia Sem.';    orderBy = 'SUM(Total_Pesquisas) DESC'; }
    else if (mode === 'hora')  { groupExpr = `CAST(Hora AS STRING)`;          labelCol = 'Hora';        orderBy = 'CAST(label AS INT64)'; }
    else if (mode === 'fila')  { groupExpr = 'queue_name';                    labelCol = 'Fila';        orderBy = 'SUM(Total_Pesquisas) DESC'; }
    else if (mode === 'colab') { groupExpr = 'name';                          labelCol = 'Colaborador'; orderBy = 'SUM(Total_Pesquisas) DESC'; }
    else                       { groupExpr = 'origem';                        labelCol = 'Equipe';      orderBy = 'SUM(Total_Pesquisas) DESC'; }

    const dsv = document.getElementById('f-date-start').value;
    const dev = document.getElementById('f-date-end').value;
    let where = `WHERE Data BETWEEN DATE('${dsv}') AND DATE('${dev}')`;
    where += sqlIn('origem',     [...msSel.equipe]);
    where += sqlIn('queue_name', [...msSel.fila]);
    where += sqlIn('name',       [...msSel.colab]);

    document.getElementById('csat-matrix').innerHTML = '<div class="loading" style="padding:24px"><div class="spinner"></div>Carregando...</div>';
    try {
      const rows = await queryBQ(`
        SELECT ${groupExpr} as label,
          SUM(Total_Pesquisas)             AS respondidas,
          SUM(Total_Satisfeito)            AS satisfeito,
          SUM(Total_Neutro)                AS neutro,
          SUM(Total_Ruim)                  AS ruim,
          SUM(Total_Encaminhadas_Pesquisa) AS encaminhadas
        FROM \`bcrcx-wfm.BCRCX.csat\`
        ${where}
        GROUP BY label
        ORDER BY ${orderBy}
      `);

      let html = `<table class="matrix-table"><thead><tr>
        <th style="text-align:left">${labelCol}</th>
        <th>Encaminhadas</th><th>Respondidas</th><th>Aderência</th>
        <th>Satisfeitos</th><th>%</th>
        <th>Neutros</th><th>%</th>
        <th>Ruins</th><th>%</th>
        <th>CSAT%</th>
      </tr></thead><tbody>`;

      rows.forEach(r => {
        const enc  = r.encaminhadas||0;
        const resp = r.respondidas||0;
        const sat  = r.satisfeito||0;
        const neu  = r.neutro||0;
        const ruim = r.ruim||0;
        const ader = enc>0 ? (resp/enc*100) : 0;
        const csat = resp>0 ? (sat/resp*100) : 0;
        const pSat = resp>0 ? (sat/resp*100)  : 0;
        const pNeu = resp>0 ? (neu/resp*100)  : 0;
        const pRui = resp>0 ? (ruim/resp*100) : 0;
        html += `<tr>
          <td>${r.label||'—'}</td>
          <td>${fmtN(enc)}</td>
          <td>${fmtN(resp)}</td>
          <td>${ader.toFixed(1).replace('.',',')}%</td>
          <td>${fmtN(sat)}</td>
          <td>${pSat.toFixed(1).replace('.',',')}%</td>
          <td>${fmtN(neu)}</td>
          <td>${pNeu.toFixed(1).replace('.',',')}%</td>
          <td>${fmtN(ruim)}</td>
          <td>${pRui.toFixed(1).replace('.',',')}%</td>
          <td style="font-weight:600">${csat.toFixed(1).replace('.',',')}%</td>
        </tr>`;
      });

      html += '</tbody></table>';
      document.getElementById('csat-matrix').innerHTML = html;
    } catch(e) {
      document.getElementById('csat-matrix').innerHTML = `<div class="error-box">⚠️ ${e.message}</div>`;
    }
  };

  // ── TME MATRIX (histogram replacement) ──
  let tmeDrillMode = 'fila';
  const buckets = [{l:'0–10s',min:0,max:10},{l:'11–20s',min:11,max:20},{l:'21–30s',min:21,max:30},{l:'31–60s',min:31,max:60},{l:'61–120s',min:61,max:120},{l:'>120s',min:121,max:Infinity}];

      btn.style.color = active ? 'var(--text)' : 'var(--text-2)';
      btn.style.boxShadow = active ? '0 1px 2px rgba(0,0,0,.06)' : 'none';
      if (active) btn.classList.add('active'); else btn.classList.remove('active');
    });

    const dsv = document.getElementById('f-date-start').value;
    const dev = document.getElementById('f-date-end').value;
    const equipev = [...msSel.equipe];
    const filav = [...msSel.fila];
    const colabv = [...msSel.colab];
    let where3 = `WHERE PARSE_DATE('%d-%m-%y', Data) BETWEEN PARSE_DATE('%d-%m-%y', '${isoToBq(dsv)}') AND PARSE_DATE('%d-%m-%y', '${isoToBq(dev)}')`;
    where3 += sqlIn('origem', equipev);
    where3 += sqlIn('queue_name', filav);
    where3 += sqlIn('name', colabv);

    // Determine group expression
    let groupExpr, groupLabel;
    if (mode === 'data')  { groupExpr = 'Data';  groupLabel = 'Data'; }
    else if (mode === 'mes')  { groupExpr = `FORMAT_DATE('%m/%y', PARSE_DATE('%d-%m-%y', Data))`; groupLabel = 'Mês'; }
    else if (mode === 'dow')  { groupExpr = `FORMAT_DATE('%A', PARSE_DATE('%d-%m-%y', Data))`; groupLabel = 'Dia Sem.'; }
    else if (mode === 'hora') { groupExpr = 'CAST(Hora AS STRING)'; groupLabel = 'Hora'; }
    else { groupExpr = fieldMap[mode] || 'queue_name'; groupLabel = labelMap[mode] || 'Fila'; }

    document.getElementById('tme-matrix').innerHTML = '<div class="loading" style="padding:24px"><div class="spinner"></div>Carregando...</div>';
    try {
      const rows = await queryBQ(`
        SELECT ${groupExpr} as label,
          SUM(CASE WHEN TME_seg BETWEEN 0 AND 10 THEN Total_Ligacoes ELSE 0 END) as b0,
          SUM(CASE WHEN TME_seg BETWEEN 11 AND 20 THEN Total_Ligacoes ELSE 0 END) as b1,
          SUM(CASE WHEN TME_seg BETWEEN 21 AND 30 THEN Total_Ligacoes ELSE 0 END) as b2,
          SUM(CASE WHEN TME_seg BETWEEN 31 AND 60 THEN Total_Ligacoes ELSE 0 END) as b3,
          SUM(CASE WHEN TME_seg BETWEEN 61 AND 120 THEN Total_Ligacoes ELSE 0 END) as b4,
          SUM(CASE WHEN TME_seg > 120 THEN Total_Ligacoes ELSE 0 END) as b5,
          SUM(Total_Ligacoes) as total
        FROM \`bcrcx-wfm.BCRCX.__pbx_calls\`
        ${where3}
        GROUP BY label
        ORDER BY ${mode==='data'||mode==='mes'||mode==='dow'||mode==='hora' ? 'label' : 'SUM(Total_Ligacoes) DESC'}
        LIMIT 100
      `);

      const cols = ['0–10s','11–20s','21–30s','31–60s','61–120s','>120s'];
      const bKeys = ['b0','b1','b2','b3','b4','b5'];
      const headerCols = cols.map(c=>'<th>'+c+'</th>').join('');
      let html = `<table class="matrix-table"><thead><tr><th>${groupLabel}</th>${headerCols}<th>Total</th></tr></thead><tbody>`;
      rows.forEach(r => {
        const lbl = mode==='fila' ? (r.label||'').replace(/^[^-]+-/,'') || r.label : (r.label||'—');
        const tot = r.total||0;
        html += '<tr>';
        html += `<td style="min-width:160px">${lbl}</td>`;
        bKeys.forEach(k => {
          const v = r[k]||0;
          const pct = tot > 0 ? v/tot : 0;
          const bg = pct > 0.5 ? `rgba(33,81,229,${Math.min(pct,.8)})` : pct > 0.2 ? `rgba(33,81,229,${pct*1.5})` : '';
          const tc = pct > 0.4 ? '#fff' : 'var(--text)';
          html += `<td style="${bg?`background:${bg};color:${tc}`:'color:var(--text-2)'}">${fmtN(v)}</td>`;
        });
        html += `<td style="font-weight:600;color:var(--text)">${fmtN(tot)}</td>`;
        html += '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('tme-matrix').innerHTML = html;
    } catch(e) { document.getElementById('tme-matrix').innerHTML = `<div class="error-box">⚠️ ${e.message}</div>`; }
  }

  // tme listeners added after innerHTML render
  // ── MAIN MATRIX ──
  let matrixDrillFila = null;
  let matrixDim = 'fila';

  window.setMatrixDim = function(dim) {
    matrixDim = dim;
    matrixDrillFila = null;
    ['data','mes','dow','hora','equipe','fila','colaborador'].forEach(d => {
      const btn = document.getElementById('mx-dim-'+d);
      if (!btn) return;
      const active = d === dim;
      btn.style.background = active ? 'var(--surface)' : 'transparent';
      btn.style.color = active ? 'var(--text)' : 'var(--text-2)';
      btn.style.boxShadow = active ? '0 1px 2px rgba(0,0,0,.06)' : 'none';
      if (active) btn.classList.add('active'); else btn.classList.remove('active');
    });
    loadMainMatrix(null);
  };

  async function loadMainMatrix(filaFilter) {
    const dsv = document.getElementById('f-date-start').value;
    const dev = document.getElementById('f-date-end').value;
    const equipev = [...msSel.equipe];
    const filav = [...msSel.fila];
    const colabv = [...msSel.colab];
    const slav = 20;

    let where4 = `WHERE PARSE_DATE('%d-%m-%y', Data) BETWEEN PARSE_DATE('%d-%m-%y', '${isoToBq(dsv)}') AND PARSE_DATE('%d-%m-%y', '${isoToBq(dev)}')`;
        where4 += sqlIn('origem', equipev);
    where4 += sqlIn('queue_name', filav);
    where4 += sqlIn('name', colabv);
    if (filaFilter) where4 += ` AND queue_name = '${filaFilter.replace(/'/g,"''")}'`;

    let groupField, labelCol, orderBy = 'SUM(Total_Ligacoes) DESC';
    if (filaFilter) {
      groupField = 'name'; labelCol = 'Operador';
    } else {
      const dimMap = {
        equipe:'origem', fila:'queue_name', colaborador:'name',
        data:'Data',
        mes:`FORMAT_DATE('%m/%y', PARSE_DATE('%d-%m-%y', Data))`,
        dow:`FORMAT_DATE('%A', PARSE_DATE('%d-%m-%y', Data))`,
        hora:'CAST(Hora AS STRING)'
      };
      const labelMap = { equipe:'Equipe', fila:'Fila', colaborador:'Colaborador', data:'Data', mes:'Mês', dow:'Dia Sem.', hora:'Hora' };
      groupField = dimMap[matrixDim] || 'queue_name';
      labelCol   = labelMap[matrixDim] || 'Fila';
      if (matrixDim === 'data' || matrixDim === 'mes') orderBy = 'label';
      if (matrixDim === 'hora') orderBy = 'CAST(label AS INT64)';
    }

    document.getElementById('main-matrix').innerHTML = '<div class="loading" style="padding:24px"><div class="spinner"></div></div>';
    document.getElementById('btn-matrix-back').style.display = filaFilter ? 'block' : 'none';
    document.getElementById('matrix-breadcrumb').textContent = filaFilter ? filaFilter.replace(/^[^-]+-/,'') : '';

    try {
      const rows = await queryBQ(`
        WITH calls AS (
          SELECT ${groupField} as label,
            SUM(Total_Ligacoes) as total,
            SUM(Atendidas) as atend,
            SUM(Abandonadas) as aband,
            SUM(CASE WHEN TME_seg <= ${slav} THEN Atendidas ELSE 0 END) as atend_sla,
            SUM(TMA_seg) / NULLIF(SUM(Atendidas), 0) as tma_atend,
            SUM(TME_seg_atendidas) / NULLIF(SUM(Atendidas), 0) as tme_atend,
            SUM(TME_seg_abandonadas) / NULLIF(SUM(Abandonadas), 0) as tme_aband,
            SUM(TME_seg) / NULLIF(SUM(Total_Ligacoes), 0) as tme_total
          FROM \`bcrcx-wfm.BCRCX.__pbx_calls\`
          ${where4}
          GROUP BY label
        ),
        csat_agg AS (
          SELECT ${groupField.replace('queue_name','queue_name').replace('CAST(Hora AS STRING)','CAST(Hora AS STRING)').replace("FORMAT_DATE('%A', PARSE_DATE('%d-%m-%y', Data))","FORMAT_DATE('%A', Data)").replace("FORMAT_DATE('%m/%y', PARSE_DATE('%d-%m-%y', Data))","FORMAT_DATE('%m/%y', Data)")} as label,
            SUM(Total_Encaminhadas_Pesquisa) as enc,
            SUM(Total_Pesquisas) as resp,
            SUM(Total_Satisfeito) as sat
          FROM \`bcrcx-wfm.BCRCX.csat\`
          WHERE Data BETWEEN DATE('${dsv}') AND DATE('${dev}')
          ${sqlIn('origem', equipev).replace('AND','AND')}
          ${sqlIn('queue_name', filav)}
          ${sqlIn('name', colabv)}
          GROUP BY label
        )
        SELECT c.*, COALESCE(s.enc,0) as enc, COALESCE(s.resp,0) as resp, COALESCE(s.sat,0) as sat
        FROM calls c LEFT JOIN csat_agg s ON c.label = s.label
        ORDER BY ${filaFilter ? 'c.total DESC' : orderBy.replace('label','c.label').replace('SUM(Total_Ligacoes) DESC','c.total DESC')}
        LIMIT 100
      `);

      const cols = ['Total','Atendidas','%Atend','Abandonadas','%Aband','NS%','TMA','TME Atend','TME Aband','TME Total','Encaminhadas','Respondidas','Aderência','CSAT%'];
      const colHeaders = cols.map(c=>'<th>'+c+'</th>').join('');
      let html = `<div style="display:flex;justify-content:flex-end;padding:4px 8px"><button onclick="window.exportMatrixCSV()" class="btn-reset" style="padding:4px 10px;font-size:11px">⬇ Exportar CSV</button></div>`;
      html += '<table class="matrix-table"><thead><tr><th>'+labelCol+'</th>'+colHeaders+'</tr></thead><tbody>';

      rows.forEach(r => {
        const canDrill = !filaFilter && matrixDim === 'fila';
        const lbl = (matrixDim === 'fila' && !filaFilter)
          ? (r.label||'').replace(/^[^-]+-/,'')||r.label||'—'
          : (r.label||'—');        const tot   = r.total||0;
        const atend = r.atend||0;
        const aband = r.aband||0;
        const nsPct = tot > 0 ? (r.atend_sla||0)/tot*100 : 0;
        const nsColor = nsPct>=80?'ns-good':nsPct>=60?'ns-warn':'ns-bad';

        html += `<tr class="${filaFilter?'':'matrix-row-fila'}" ${canDrill ? `style="cursor:pointer" onclick="window.matrixDrill('${(r.label||'').replace(/'/g,"\'")}')" title="Clique para ver operadores"` : ''}>`;
        html += `<td>${lbl}</td>`;
        html += `<td>${fmtN(tot)}</td>`;
        html += `<td>${fmtN(atend)}</td>`;
        html += `<td>${tot>0?(atend/tot*100).toFixed(1).replace('.',',')+'%':'—'}</td>`;
        html += `<td>${fmtN(aband)}</td>`;
        html += `<td>${tot>0?(aband/tot*100).toFixed(1).replace('.',',')+'%':'—'}</td>`;
        html += `<td>${nsPct.toFixed(1).replace('.',',')}%</td>`;
        html += `<td>${fmtMmSs(r.tma_atend)}</td>`;
        html += `<td>${fmtMmSs(r.tme_atend)}</td>`;
        html += `<td>${fmtMmSs(r.tme_aband)}</td>`;
        html += `<td>${fmtMmSs(r.tme_total)}</td>`;
        const enc  = r.enc||0;
        const resp = r.resp||0;
        const sat  = r.sat||0;
        const ader = enc>0  ? (resp/enc*100).toFixed(1).replace('.',',')+'%' : '—';
        const csat = resp>0 ? (sat/resp*100).toFixed(1).replace('.',',')+'%' : '—';
        html += `<td>${fmtN(enc)}</td>`;
        html += `<td>${fmtN(resp)}</td>`;
        html += `<td>${ader}</td>`;
        html += `<td>${csat}</td>`;
        html += '</tr>';
      });

      html += '</tbody></table>';
      document.getElementById('main-matrix').innerHTML = html;

      // Store for CSV export
      window._matrixRows = rows;
      window._matrixLabelCol = labelCol;
      window.exportMatrixCSV = function() {
        const header = [window._matrixLabelCol,'Total','Atendidas','%Atend','Abandonadas','%Aband','NS%','TMA','TME Atend','TME Aband','TME Total','Encaminhadas','Respondidas','Aderência','CSAT%'];
        const lines = [header.join(';')];
        (window._matrixRows||[]).forEach(r => {
          const tot   = r.total||0;
          const atend = r.atend||0;
          const aband = r.aband||0;
          const ns    = tot>0?((r.atend_sla||0)/tot*100):0;
          const enc   = r.enc||0;
          const resp  = r.resp||0;
          const sat   = r.sat||0;
          const ader  = enc>0?(resp/enc*100):0;
          const csat  = resp>0?(sat/resp*100):0;
          lines.push([
            r.label||'—',
            tot, atend,
            (tot>0?(atend/tot*100):0).toFixed(1).replace('.',',')+'%',
            aband,
            (tot>0?(aband/tot*100):0).toFixed(1).replace('.',',')+'%',
            ns.toFixed(1).replace('.',',')+'%',
            fmtMmSs(r.tma_atend),
            fmtMmSs(r.tme_atend),
            fmtMmSs(r.tme_aband),
            fmtMmSs(r.tme_total),
            enc, resp,
            ader.toFixed(1).replace('.',',')+'%',
            csat.toFixed(1).replace('.',',')+'%'
          ].join(';'));
        });
        const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = 'matriz_ligacoes.csv'; a.click();
        URL.revokeObjectURL(url);
      };
    } catch(e) { document.getElementById('main-matrix').innerHTML = `<div class="error-box">⚠️ ${e.message}</div>`; }
  }

  window.matrixDrill = function(fila) {
    matrixDrillFila = fila;
    loadMainMatrix(fila);
  };

  // matrix-back listener added after innerHTML render

}); // DOMContentLoaded
</script>
</body>
</html>
